name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.configuration }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        # Sonoma14.0 = macOS 14.0-14.3 ABI, Sonoma14.4 = macOS 14.4+ ABI,
        # Sequoia = macOS 15.2+ (Darwin 24.2.0-24.99.99) WCL ABI.
        platform: [Sonoma14.0, Sonoma14.4, Sequoia]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build AirportItlwm for ${{ matrix.platform }}
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -project itlwm.xcodeproj -scheme "AirportItlwm-$PLATFORM" \
            -configuration "$CONFIGURATION" -jobs 3 ARCHS=x86_64 \
            SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO GIT_COMMIT="_$(git rev-parse --short HEAD)" \
            build > "logs/AirportItlwm-$PLATFORM.log" 2>&1 || {
              echo "--- compile diagnostics (error lines) ---"
              grep -n "error:" "logs/AirportItlwm-$PLATFORM.log" | head -60 || true
              echo "--- build log tail ---"
              tail -250 "logs/AirportItlwm-$PLATFORM.log"
              exit 1; }
      - name: Verify kernel extension
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          kext="build/products/$CONFIGURATION/$PLATFORM/AirportItlwm.kext"
          test -d "$kext" || { echo "FAIL: $kext missing"; exit 1; }
          test -f "$kext/Contents/MacOS/AirportItlwm" || { echo "FAIL: kext binary missing"; exit 1; }
          # Architecture must be x86_64 (Dell G3 3579).
          lipo -info "$kext/Contents/MacOS/AirportItlwm" | tee /tmp/lipo.txt
          grep -q "x86_64" /tmp/lipo.txt || { echo "FAIL: wrong architecture"; exit 1; }
          grep -q "arm64" /tmp/lipo.txt && { echo "FAIL: arm64 leaked into build"; exit 1; } || true
          # Bundle metadata sanity.
          plutil -lint "$kext/Contents/Info.plist"
          plutil -convert xml1 -o /tmp/kext-info.plist "$kext/Contents/Info.plist"
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$kext/Contents/Info.plist")
          version=$(plutil -extract CFBundleVersion raw "$kext/Contents/Info.plist")
          echo "bundle_id=$bundle_id version=$version"
          [ "$bundle_id" = "com.zxystd.AirportItlwm" ] || { echo "FAIL: unexpected bundle id"; exit 1; }
          # Required kext libraries present (plist keys contain dots so grep the XML form).
          for lib in com.apple.iokit.IO80211Family com.apple.kpi.libkern com.apple.kpi.iokit; do
            grep -q "<key>$lib</key>" /tmp/kext-info.plist || {
              echo "FAIL: missing OSBundleLibrary $lib"; exit 1; }
            echo "lib $lib -> present"
          done
          case "$PLATFORM" in
            Sequoia)
              grep -q "<key>com.apple.iokit.IOSkywalkFamily</key>" /tmp/kext-info.plist || {
                echo "FAIL: Sequoia build must link IOSkywalkFamily"; exit 1; }
              grep -q "<key>com.apple.driver.corecapture</key>" /tmp/kext-info.plist || {
                echo "FAIL: Sequoia build must link corecapture"; exit 1; } ;;
          esac
          # Firmware is embedded in the Mach-O binary itself (FwBinary.cpp,
          # zlib-compressed, ~16MB payload), not in Contents/Resources.
          # Verify the 9462's 9000-series firmware plus representative
          # families are referenced by the driver, and the binary carries
          # the compressed firmware payload.
          binfile="$kext/Contents/MacOS/AirportItlwm"
          fwbytes=$(stat -f %z "$binfile")
          echo "binary_size=$fwbytes"
          [ "$fwbytes" -gt 10000000 ] || { echo "FAIL: binary too small to contain firmware"; exit 1; }
          # Dump strings once: grep -q on a pipe would SIGPIPE `strings` under
          # pipefail as soon as it matches, falsely failing the check.
          strings "$binfile" > /tmp/fw-strings.txt
          for fw in iwm-9000-46 iwm-9260-46 iwm-8265-36 iwlwifi-Qu-b0-jf-b0-68 iwlwifi-Qu-c0-jf-b0-68 iwlwifi-QuZ-a0-jf-b0-68; do
            grep -q "$fw" /tmp/fw-strings.txt || { echo "FAIL: firmware $fw not embedded"; exit 1; }
            echo "fw $fw -> embedded"
          done
          # Undefined symbols should be covered by declared OSBundleLibraries.
          nm -u "$kext/Contents/MacOS/AirportItlwm" | head -200 > /tmp/undef.txt || true
          echo "undefined_symbol_count=$(wc -l < /tmp/undef.txt)"
          # Record checksum for release traceability.
          shasum -a 256 "$kext/Contents/MacOS/AirportItlwm" | tee "logs/$PLATFORM-$CONFIGURATION.sha256"
      - name: Verify source invariants (security + join/scan contract)
        run: |
          set -euo pipefail
          # 1. No key material in logs: PTK/GTK/PMK hexdumps and full EAPOL
          #    frame dumps must never return.
          if grep -rn "hexdump(key->key" AirportItlwm/ ; then
            echo "FAIL: key material hexdump present"; exit 1; fi
          if grep -rn "hexdump((uint8_t\*)mbuf_data" AirportItlwm/ ; then
            echo "FAIL: EAPOL frame dump present"; exit 1; fi
          # 2. Join fast path from the cached scan target must exist in both
          #    the V2 (Sonoma/Sequoia) and legacy ioctl paths.
          grep -q "attemptFastJoin" AirportItlwm/AirportItlwmV2.cpp \
            || { echo "FAIL: fast join missing from V2"; exit 1; }
          grep -q "ieee80211_find_join_target" AirportItlwm/AirportSTAIOCTL.cpp \
            || { echo "FAIL: fast join missing from legacy path"; exit 1; }
          grep -q "ieee80211_find_join_target" itl80211/openbsd/net80211/ieee80211_node.c \
            || { echo "FAIL: join target helper missing from net80211"; exit 1; }
          # 3. Shared one-shot scan restriction consumed by the firmware
          #    scan builders (directed Apple80211 scans).
          grep -q "ic_scan_restricted" itl80211/openbsd/net80211/ieee80211_var.h \
            || { echo "FAIL: shared scan restriction state missing"; exit 1; }
          grep -q "iwm_scan_take_restriction" itlwm/hal_iwm/scan.cpp \
            || { echo "FAIL: iwm scan restriction consumption missing"; exit 1; }
          # 4. SSID getter contract: no strlen on ESSID byte arrays.
          if grep -rn "strlen((const char\*)ic->ic_des_essid" AirportItlwm/ ; then
            echo "FAIL: strlen-based SSID getter present"; exit 1; fi
          # 5. Snapshot-based scan enumeration (no live-tree cursor on the
          #    non-WCL path).
          grep -q "fScanSnapshot" AirportItlwm/AirportItlwmV2.hpp \
            || { echo "FAIL: scan snapshot missing"; exit 1; }
          echo "invariants -> OK"
      - name: Package kernel extension
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          products="$PWD/build/products/$CONFIGURATION"
          version=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          short_sha=$(git rev-parse --short HEAD)
          configuration=$(printf '%s' "$CONFIGURATION" | tr '[:lower:]' '[:upper:]')
          suffix="v$version-$configuration-alpha-$short_sha"
          ditto -c -k --keepParent "$products/$PLATFORM/AirportItlwm.kext" "artifacts/AirportItlwm-$PLATFORM-$suffix.zip"
          shasum -a 256 "artifacts/AirportItlwm-$PLATFORM-$suffix.zip" > "artifacts/AirportItlwm-$PLATFORM-$suffix.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-${{ matrix.platform }}-${{ matrix.configuration }}
          path: artifacts/AirportItlwm-${{ matrix.platform }}-*.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.configuration }}
          path: logs

  prerelease:
    name: Publish development build
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/download-artifact@v4
        with:
          pattern: AirportItlwm-*
          path: artifacts
          merge-multiple: true
      - name: Publish alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          tag="v$version-alpha"
          # Use the checked-in handoff notes and append the recent change log.
          cp .github/release-notes.md ReleaseNotes.md
          {
            echo
            echo '## Recent changes'
            git log -10 --format='- %h %s'
            echo
            echo "**Build identity: v$version-alpha @ $(git rev-parse --short HEAD) (CI-verified, not hardware-verified).**"
          } >> ReleaseNotes.md
          if gh release view "$tag" --json isPrerelease > current-release.json 2>/dev/null; then
            # Never replace a stable release with development artifacts.
            jq -e '.isPrerelease == true' current-release.json > /dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$tag" --prerelease --notes-file ReleaseNotes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes-file ReleaseNotes.md
          fi
          gh release upload "$tag" artifacts/AirportItlwm-*.zip* --clobber

          # Remove obsolete assets only after the replacement set has uploaded.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | [.id, .name] | @tsv' > release-assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ ! -f "artifacts/$asset_name" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < release-assets.tsv

          # Keep exactly one prerelease; stable releases are retained.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.prerelease and (.draft | not)) | .tag_name' > prereleases.txt
          while IFS= read -r old_tag; do
            if [[ "$old_tag" != "$tag" ]]; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < prereleases.txt
