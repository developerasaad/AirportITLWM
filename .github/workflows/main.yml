name: Build AX211 Sequoia Debug

# Single supported build configuration for this fork:
#   Target  : MSI Modern 14 C12MO / Intel Wi-Fi 6E AX211 160 MHz
#   OS      : macOS Sequoia 15.8.2 (Darwin 24.x)
#   Arch    : x86_64
#   Config  : Debug
#   Product : AirportItlwm.kext (native Airport/Skywalk/WCL integration)
#
# RELEASE POLICY — standalone release publishing, no tag-based releases:
#   - Manual-only (workflow_dispatch). Never triggered by push, PR,
#     schedule, or tag events. CI NEVER creates tags, releases, or any
#     git refs.
#   - Exactly one rolling release carries the current build (input
#     release_name, default v2.5.0-alpha). The publish job resolves the
#     release BY NAME through the releases API and works purely on the
#     release ID — no tag involvement anywhere. It deletes this build
#     family's stale assets and uploads the fresh ones, so the release
#     always ships exactly the newest verified binary.
#   - The same-named lightweight tag is a fixed anchor required by
#     GitHub's release model; it never moves and nothing builds from it.
#   - Release history is kept intentionally minimal: the rolling release
#     plus designated historical releases (v2.4.0-ax211-reduced).
#   - Set publish_release=false for build-only verification runs that
#     must not touch the release.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Replace rolling-release assets with this build"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      release_name:
        description: "Name of the existing standalone release to publish into"
        required: true
        type: string
        default: "v2.5.0-alpha"

permissions:
  contents: read

concurrency:
  group: build-ax211
  cancel-in-progress: false

jobs:
  build:
    name: AirportItlwm Sequoia Debug (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build AirportItlwm (Sequoia Debug)
        env:
          PLATFORM: Sequoia
          CONFIGURATION: Debug
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -project itlwm.xcodeproj -scheme "AirportItlwm-$PLATFORM" \
            -configuration "$CONFIGURATION" -jobs 3 ARCHS=x86_64 \
            SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO GIT_COMMIT="_$(git rev-parse --short HEAD)" \
            build > "logs/AirportItlwm-$PLATFORM.log" 2>&1 || {
            echo "--- compile diagnostics (error lines) ---"
            grep -n "error:" "logs/AirportItlwm-$PLATFORM.log" | head -80 || true
            echo "--- build log tail ---"
            tail -300 "logs/AirportItlwm-$PLATFORM.log"
            exit 1; }
      - name: Verify kernel extension
        env:
          PLATFORM: Sequoia
          CONFIGURATION: Debug
        run: |
          set -euo pipefail
          kext="build/products/$CONFIGURATION/$PLATFORM/AirportItlwm.kext"
          test -d "$kext" || { echo "FAIL: $kext missing"; exit 1; }
          test -f "$kext/Contents/MacOS/AirportItlwm" || { echo "FAIL: kext binary missing"; exit 1; }
          # Architecture must be x86_64 only (AX211 target is Intel macOS).
          lipo -info "$kext/Contents/MacOS/AirportItlwm" | tee /tmp/lipo.txt
          grep -q "x86_64" /tmp/lipo.txt || { echo "FAIL: wrong architecture"; exit 1; }
          grep -q "arm64" /tmp/lipo.txt && { echo "FAIL: arm64 leaked into build"; exit 1; } || true
          # Bundle metadata sanity.
          plutil -lint "$kext/Contents/Info.plist"
          plutil -convert xml1 -o /tmp/kext-info.plist "$kext/Contents/Info.plist"
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$kext/Contents/Info.plist")
          version=$(plutil -extract CFBundleVersion raw "$kext/Contents/Info.plist")
          echo "bundle_id=$bundle_id version=$version"
          [ "$bundle_id" = "com.zxystd.AirportItlwm" ] || { echo "FAIL: unexpected bundle id"; exit 1; }
          # Required kext libraries present.
          for lib in com.apple.iokit.IO80211Family com.apple.kpi.libkern com.apple.kpi.iokit; do
            grep -q "<key>$lib</key>" /tmp/kext-info.plist || { echo "FAIL: missing OSBundleLibrary $lib"; exit 1; }
            echo "lib $lib -> present"
          done
          # Sequoia native integration must link IOSkywalkFamily and corecapture.
          grep -q "<key>com.apple.iokit.IOSkywalkFamily</key>" /tmp/kext-info.plist || { echo "FAIL: Sequoia build must link IOSkywalkFamily"; exit 1; }
          grep -q "<key>com.apple.driver.corecapture</key>" /tmp/kext-info.plist || { echo "FAIL: Sequoia build must link corecapture"; exit 1; }
          echo "sequoia skywalk/corecapture linkage -> OK"
          # Firmware is embedded in the Mach-O (FwBinary.cpp, zlib-compressed).
          # The AX211 build embeds exactly one firmware family: the API 89
          # iwlwifi-so-a0-gf-a0 set (ucode + PNVM) pinned to build d2579d43
          # (the revision validated on the target MSI Modern 14 C12MO under
          # Ubuntu 26.10). Binary floor reflects one embedded family:
          # ~1.74 MB raw firmware at ~2.2:1 zlib ratio plus driver code.
          binfile="$kext/Contents/MacOS/AirportItlwm"
          fwbytes=$(stat -f %z "$binfile")
          echo "binary_size=$fwbytes"
          [ "$fwbytes" -gt 1200000 ] || { echo "FAIL: binary too small to contain firmware"; exit 1; }
          strings "$binfile" > /tmp/fw-strings.txt
          for fw in iwlwifi-so-a0-gf-a0-89 iwlwifi-so-a0-gf-a0.pnvm; do
            grep -q "$fw" /tmp/fw-strings.txt || { echo "FAIL: firmware $fw not embedded"; exit 1; }
            echo "fw $fw -> embedded"
          done
          # API 89 is the exclusive target. The embedded set is generated
          # from itlwm/firmware/ (fw_gen.sh), so assert the exact input set:
          # exactly one ucode + one pnvm, and nothing else.
          fw_files=$(ls itlwm/firmware | grep "^iwlwifi-" | sort | tr '\n' ' ')
          echo "fw_files=$fw_files"
          [ "$fw_files" = "iwlwifi-so-a0-gf-a0-89.ucode iwlwifi-so-a0-gf-a0.pnvm " ] || {
            echo "FAIL: firmware directory must contain only the API 89 set"; exit 1; }
          echo "exclusive api-89 firmware set -> OK"
          # AX211-family PCI device IDs must be present in the matching table.
          for devid in 0x51F08086 0x54F08086 0x7F708086; do
            grep -q "$devid" "$kext/Contents/Info.plist" || { echo "FAIL: AX211 device id $devid missing from IOPCIMatch"; exit 1; }
            echo "devid $devid -> matched"
          done
          # Record build identity and checksums.
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          shasum -a 256 "$binfile" | tee "logs/AirportItlwm-bin.sha256"
          nm -u "$binfile" | head -200 > /tmp/undef.txt || true
          echo "undefined_symbol_count=$(wc -l < /tmp/undef.txt)"
      - name: Package kernel extension
        env:
          PLATFORM: Sequoia
          CONFIGURATION: Debug
        run: |
          set -euo pipefail
          mkdir -p artifacts
          products="$PWD/build/products/$CONFIGURATION"
          version=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          short_sha=$(git rev-parse --short HEAD)
          suffix="v${version}-AX211-Sequoia-Debug-${short_sha}"
          ditto -c -k --keepParent "$products/$PLATFORM/AirportItlwm.kext" "artifacts/AirportItlwm-${suffix}.zip"
          shasum -a 256 "artifacts/AirportItlwm-${suffix}.zip" > "artifacts/AirportItlwm-${suffix}.zip.sha256"
          cp "logs/AirportItlwm-bin.sha256" "artifacts/AirportItlwm-${suffix}.bin.sha256" 2>/dev/null || true
          echo "ARTIFACT_SUFFIX=${suffix}" >> "$GITHUB_ENV"
          ls -la artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-Sequoia-Debug
          path: artifacts/AirportItlwm-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: logs

  publish:
    name: Publish to standalone release (replace assets, no tags)
    needs: build
    if: ${{ github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: AirportItlwm-Sequoia-Debug
          path: dist
      - name: Resolve standalone release by name (release-ID API, no tags)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.name == \"$RELEASE_NAME\" or .tag_name == \"$RELEASE_NAME\") | .id" \
            | head -n1)
          if [ -z "$id" ]; then
            echo "FAIL: no release named '$RELEASE_NAME'."
            echo "This workflow is release-only: it never creates releases or tags."
            echo "Create/restore the release manually or pass another existing release name."
            exit 1
          fi
          echo "target standalone release -> $RELEASE_NAME (id $id)"
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
      - name: Replace release assets with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stale assets from previous automated builds of this family are
          # superseded once a new build is published; delete them first so
          # the release always carries exactly the newest build.
          mapfile -t stale < <(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | startswith("AirportItlwm-") and contains("AX211-Sequoia-Debug-")) | "\(.id) \(.name)"')
          for entry in "${stale[@]}"; do
            asset_id=${entry%% *}
            asset_name=${entry#* }
            echo "deleting stale asset: $asset_name (id $asset_id)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          echo "uploading fresh build assets:"
          ls -la dist
          for f in dist/*; do
            name=$(basename "$f")
            echo "uploading $name"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" > /dev/null
          done
          echo "release assets after publish:"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name'
